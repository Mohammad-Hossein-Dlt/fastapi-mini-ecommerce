services:
  nginx-service:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 80:80
    depends_on:
      - auth-service
      - product-service
      - order-service
      - admin-service
      - user-service

  broker:
    image: nats:latest
    container_name: broker_service
    restart: always
    ports:
      - 4222:4222
      - 8222:8222
    command: ["-js"]

  mongodb-service:
    image: mongo
    container_name: mongo-db
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB__USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB__PASSWORD}

  postgres-service:
    image: postgres
    container_name: postgres-db
    restart: always
    ports:
      - 54032:5432
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES__USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__DB_NAME}

  auth-service:
    working_dir: /app
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth_service
    restart: always
    env_file:
      - .env
    depends_on:
      - broker
      - mongodb-service
      - postgres-service

  product-service:
    working_dir: /app
    build:
      context: ./product_service
      dockerfile: Dockerfile
    container_name: product_service
    restart: always
    env_file:
      - .env
    depends_on:
      - broker
      - mongodb-service
      - postgres-service

  order-service:
    working_dir: /app
    build:
      context: ./order_service
      dockerfile: Dockerfile
    container_name: order_service
    restart: always
    env_file:
      - .env
    depends_on:
      - broker
      - mongodb-service
      - postgres-service

  admin-service:
    working_dir: /app
    build:
      context: ./admin_service
      dockerfile: Dockerfile
    container_name: admin_service
    restart: always
    ports:
      - 81:80
    env_file:
      - .env
    depends_on:
      - broker
      - mongodb-service
      - postgres-service

  user-service:
    working_dir: /app
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user_service
    restart: always
    ports:
      - 82:80
    env_file:
      - .env
    depends_on:
      - broker
      - mongodb-service
      - postgres-service

